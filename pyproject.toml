[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-health-api"
version = "0.1.0"
description = "API Demo de Criptografia de Dados Sensíveis (PII & Saúde) no Banco de Dados com FastAPI, SQLAlchemy 2.0, AES-256-GCM, HKDF, Blind Index (HMAC) e Argon2id."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Crypto Health Demo Team" }
]
keywords = [
    "fastapi",
    "cryptography",
    "aes-gcm",
    "hkdf",
    "argon2id",
    "blind-index",
    "lgpd",
    "hipaa",
    "sqlalchemy",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
source = ["src/app"]
omit = ["src/app/main.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # FastAPI Depends in default args
    "E501", # Line length delegated to ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
